<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTER APP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="main-div">
        <div class="sec-div">
            <div class="span-div" id="num"> <span>0</span></br></div>
        </div>
        <div class="btn-div">
         <button class="btn" onclick="incres()" ><i class="fa-solid fa-plus clr"></i></button>
         <button class="btn" onclick="decres()" ><i class="fa-solid fa-minus clr"></i></button></br>
         <button class="btn" onclick="restart()" ><i class="fa-solid fa-rotate-left clr"></i></button>
         <button class="btn" onclick="save()"><i class="fa-regular fa-floppy-disk clr"></i></button>
        </div>
    </div>


<script src="app.js"></script>
</body>
</html>
